name: SingleHop
description: SingleHop was a Chicago-based managed hosting, dedicated server, and
  cloud infrastructure provider, historically known for its LEAP customer control
  panel and API. It was surfaced as a portfolio company of Battery Ventures and added
  to the API Evangelist network as a stub for enrichment. The SingleHop brand was
  acquired by INAP (Internap) in 2016 and has since been fully absorbed; the
  singlehop.com domain now HTTP 301-redirects to horizoniq.com (HorizonIQ, the
  successor infrastructure brand). No independent SingleHop developer portal, API
  documentation, or OpenAPI surface remains publicly reachable under the SingleHop
  brand.
